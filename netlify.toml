[build]
  command = "npm run build"
  publish = "dist"

# Netlify Forms are detected automatically from the static HTML output
# (see src/components/LeadCaptureBox.astro and src/pages/contact.astro —
# both use data-netlify="true"). No extra config needed here for that.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
